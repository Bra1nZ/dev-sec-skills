# Synthetic fixture — not evidence about any real project.
name: shared-tests-open-claim
description: "An open claim cites only a declared shared test. Rule 1 passes\n      because the sharing is declared, and rule 2 exempts open claims: they carry\n      no evidence status to inherit. L4 still warns that open has test evidence\n      (V2-34).\n"
files:
  tests/test_suite.py: "def test_gate():\n    report(\"F1 gate rejects anonymous\")\n\n\ndef test_audit():\n    report(\"F2 audit log records the denial\")\n"
ledger:
  claims:
  - id: C-01
    claim: The gate eventually records the denial in the audit log.
    mechanism: Handler logs the denied session before returning.
    evidence:
    - kind: test
      command: python3 -m pytest -v
      tests:
      - F1
      shared_tests:
      - id: F1
        reason: The test attempts both the gate and the audit path.
    scope: Synthetic fixture.
    status: open
    limitations: The audit path is not implemented yet.
  - id: C-02
    claim: The gate rejects anonymous requests.
    mechanism: Session check before handler dispatch.
    evidence:
    - kind: test
      command: python3 -m pytest -v
      tests:
      - F1
      - F2
      shared_tests:
      - id: F1
        reason: The test attempts both the gate and the audit path.
    scope: Synthetic fixture.
    status: tested
args:
- --max-age-days
- '3650'
expect:
  L1: none
  L3: none
  L4: warning
  L6: none
exit: 0
suite_glob: '**/*.py'
