        build_flags: -Zsanitizer=address
        command: RUSTUP_TOOLCHAIN=nightly RUSTFLAGS=-Zsanitizer=address cargo test -p craft-i18n-tests rejects_bad_row
        exit_code: 0
        started_at: '2026-11-01T10:00:00+03:00'
        finished_at: '2026-11-01T10:00:04+03:00'
        output: reports/asan.log
        output_sha256: 34272a598345b3d79ca6c3ed13654c80a0c86bfe3d852018cf1ecd624097f5b9
