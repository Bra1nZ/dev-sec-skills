# Synthetic fixture — not evidence about any real project.
name: sanitizer-finding-hidden
description: "The record declares a clean ASan run (status=completed, exit_code=0) but
  the output it cites carries an ERROR: AddressSanitizer line and a SUMMARY line. The
  bytes contradict the declaration, so L2 must error rather than accept the claimed
  status. This is the case a record that only stores a count of findings would miss if
  the count were dropped or forged.
"
files:
  tests/rows.rs: |
    #[test]
    fn rejects_bad_row() {
        assert!(check_bad_row().is_none());
    }
  reports/asan.log: |
    ============================= test session starts =============================
    collected 1 item

    tests/rows.rs::rejects_bad_row ... ok

    =================================================================
    ==4213==ERROR: AddressSanitizer: heap-use-after-free on address 0x602000000010
    READ of size 4 at 0x602000000010 thread T0
        #0 0x55d4c0 in craft_i18n::rows::check_bad_row
    SUMMARY: AddressSanitizer: heap-use-after-free
    ==4213==ABORTING
    =================================================================
  docs/README.md: |
    The intake rejects a bad row before it reaches the writer.
