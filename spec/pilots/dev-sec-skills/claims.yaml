    limitations: "Text scan of .github/workflows, not a proof about the pinned code. The rule set is authored here, not the Semgrep `p/ci` benchmark; a different rule set would produce a different queue. The pre-fix and post-fix runs are one engine and one rule set. The GitHub-side schedule of fuzz-nightly has not fired yet (V2-19), so the workflow's runtime behavior is unobserved. Without an external anchor (C-13) a forger can rewrite the record and both outputs together."
