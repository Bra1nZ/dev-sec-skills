      actors_excluded:
        - "Other entry points into rbac.users: grants, apply_policy_document and RLS are not exercised, so a lost update there is invisible to this oracle."
        - "Other PostgreSQL versions, isolation levels and configurations: the stand runs the defaults of one server."
        - "Scheduling, latency and deadlocks: the oracle records no timings and a slow or waiting run still passes."
        - "The extension packaging path: the SQL is installed as a plain script, so CREATE EXTENSION bookkeeping and a packaging defect are out of scope."
        - "Races the two hand-written mutants do not model: a caught mutant says the oracle is sensitive to that edit, not that it covers every interleaving."
