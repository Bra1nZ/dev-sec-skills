  - id: C-42
    claim: "A recorded verdict is journaled in an append-only hash chain, and an edited, dropped or truncated entry, a status change with no entry, a replaced head or a foreign signer is rejected"
    mechanism: "tools/verdict_journal.py keeps spec/journal/verdicts.jsonl — one canonical JSON line per verdict, each line hashing the line before it — and a signed head in spec/journal/head.json{,.sig}; J1 checks seq/prev/hash and the status vocabulary, J2 checks the last word per claim against both in-repo ledgers (status, evidence set, retired tombstone), J3 checks that the journal at --git-ref is a byte prefix of the working file, J4 checks the canonical head, the journal hash, the exact ledger bytes and the ssh signature; append is atomic and refuses a broken chain or head; D-JOURNAL (spec/pilots/dev-sec-skills/detectors/test_verdict_journal.py) runs evals/journal/run_evals.py as one test ID"
    status: tested
    scope:
      platforms: "Python 3.11.2, PyYAML, OpenSSH ssh-keygen and git on Linux; the two in-repo ledgers (spec/pilots/dev-sec-skills/claims.yaml, spec/pilots/craft-i18n/claims.yaml) at commit 1433bf6; 11 journaled verdicts in one backfilled append plus one signed head"
      actors_excluded:
        - "The external rbac_pg ledger (../rbac_pg/docs/claims.yaml): it lives in another checkout, so a ../ path would tie the journal to one directory layout."
        - "The key holder: whoever holds the private key can re-sign the head. Replacing allowed_signers, rewriting the chain and amending the commit defeats J3 and J4; the rewrite-journal-and-resign drill records that gap."
        - "Time: there is no timestamping authority, so the entry date is the day the verdict was journaled, not the day it was first claimed."
        - "Records inside evidence (tool_output, review notes): they are not anchored, so an edit inside one changes no evidence identity and needs no journal entry."
    evidence:
