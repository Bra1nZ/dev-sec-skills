    residual_risk: "The identity trusts the product's own event log as its account of the increments, so a defect that drops both the counter increment and the log line is self-consistent and passes. A race that neither the lock check nor the counter identity can see (for example, a lost audit event with a correct counter) is outside what the oracle measures."
    limitations: "One path (lockout), one PostgreSQL version, one machine and one account; grants, apply_policy_document and RLS are not exercised. The oracle measures no latency, deadlocks or lock waits. The SQL is installed as a script, so extversion is not maintained and a packaging defect is invisible. The mutants are hand-written: 2/2 is sensitivity to those two edits, not completeness. The stand is external, so make concurrency-rbac and make concurrency-rbac-mutants stay out of make verify and run in verify-all. INV-TX-003 stays open in spec/invariants/catalog.yaml: one executable oracle does not prove the invariant at the other entry points."
