    residual_risk: "The chain proves that the entries filed under a key were not changed afterwards, not that the verdicts were true when filed: the key holder can journal a verdict that never happened, and whoever can replace allowed_signers and rewrite history can re-sign a different past."
    limitations: "Backfill: the 11 existing verdicts were journaled on 2026-11-08 with that date, so the chain says nothing about when they were first claimed. The journal covers only the two in-repo ledgers; the rbac_pg ledger is outside it. proof and review records are not anchored, so an edit inside them is invisible to J2. There is no transparency log, timestamping authority or key revocation; the red-team drill rewrite-journal-and-resign passes with every gate green. The eval is synthetic (temporary git repositories and a throw-away key); D-JOURNAL exercises the gate, not the committed journal, whose J1-J4 run in make verify. bootstrap does not vendor the journal, so a bootstrapped target starts with an empty one."
