  # Open: found during the pilot, recorded as a gap.
  - id: C-08
    claim: "A translation cannot hide an invisible formatting character (bidi override, zero-width space) that changes how the UI renders"
    mechanism: "parse_row rejects Cc control characters and U+FEFF, but not Unicode Cf formatting characters"
    status: open
    scope:
      platforms: "Unicode as implemented by Rust's char::is_control (Cc only)"
      actors_excluded: ["rendering behaviour of each app's toolkit"]
    evidence:
      - kind: review
        artifact: "crates/craft-i18n-tests/src/catalog.rs"
        commit: "5c5c55400e8f7f4ee4f64a64dc196335a6a1f256"
        date: "2026-11-06"
    limitations: "Probe in dev-sec-skills at spec/pilots/craft-i18n/probes/invisible-characters (run 2026-11-06 against 5c5c554): U+202E, U+200B and U+2066 pass and reach the Row; U+FEFF inside a row and Cc U+0007 are rejected. The gap is therefore Unicode Cf formatting characters other than U+FEFF."
    last_verified: "2026-11-06"
