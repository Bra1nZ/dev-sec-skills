  # docs/catalog-format.md, "Locales and files" and "Language name".
  - id: C-06
    claim: "Locale directories are lowercase BCP 47 and catalog files are common.tsv or <app>.tsv; dotfiles are ignored and any other file fails"
    mechanism: "check_locale_name round-trips through LanguageIdentifier and requires lowercase; is_catalog_name allows [a-z0-9]+(-[a-z0-9]+)* before .tsv; entries() skips dotfiles"
    status: tested
    scope:
      platforms: "unic-langid 0.9 as pinned in Cargo.lock"
      actors_excluded: ["case sensitivity on case-insensitive filesystems, which CI does not exercise"]
    evidence:
      - kind: test
        tests: [bad_locale_name, stray_file, bad_app_file_name, locale_names, clean_tree_passes]
        command: "cargo test --offline -p craft-i18n-tests"
        artifact: "crates/craft-i18n-tests/src/locale.rs"
        commit: "5c5c55400e8f7f4ee4f64a64dc196335a6a1f256"
        date: "2026-11-07"
        run_record:
          runner: "cargo test"
          command: "cargo test --offline -p craft-i18n-tests"
          commit: "5c5c55400e8f7f4ee4f64a64dc196335a6a1f256"
          exit_code: 0
