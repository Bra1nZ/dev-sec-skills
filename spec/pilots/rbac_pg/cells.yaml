# Pilot cell registry for rbac_pg ("Цитадель"), a PostgreSQL RBAC extension.
#
# Purpose: calibrate the taxonomy and the cell contract on a real repository.
# Every cell below is derived from a detector that exists in the repository
# (a test suite, a claim-ledger review, or a recorded gap), not invented.
#
# Evidence policy for this pilot:
#   - `tested` means a test detector exists in the repository and the suite has
#     a recorded passing baseline in TESTING.md. The pilot did NOT re-run the
#     suites: they need a live PostgreSQL 15+ cluster. `last_verified` is the
#     date of the recorded baseline, not the date of this review.
#   - `reviewed` means the property is asserted by a review artifact, not by an
#     executable detector.
#   - `open` means no detector covers the property, or the recorded run shows
#     the property failing (the side-channel GAPs).
#   - No detector has a per-cell mutation fixture. This is the pilot's central
#     verify-the-verifier gap and is reported, not fabricated.
#
# Lint:
#   python3 tools/cell_lint.py \
#     --root /home/admini/projects/rbac_pg \
#     --ledger /home/admini/projects/rbac_pg/docs/claims.yaml \
#     spec/pilots/rbac_pg/cells.yaml

