# Static-analysis triage ledger for the rbac_pg pilot (V2-36, C-40).
#
# This ledger is authored here, not in the target repository: rbac_pg stays
# read-only, and its docs/claims.yaml keeps only the product claims C-01..C-07.
# Claim IDs are local to the file; `C-40` mirrors the CONCEPT row of the same
# name (a static-analysis finding does not disappear) and is not the same
# object as the craft-i18n instantiation.
#
# The 249 entries are a triage of a review queue, not a proof of safety. Both
# engines report interpolated SQL text in operator-run test harnesses; every
# reason below names the mechanism that keeps the interpolated value a
# constant, a literal-bound parameter, a loop over literal names, a catalog
# identifier or a script-generated token. No entry is routed to a cell: the
# pilot registry has no cell whose failure_class is invalid-or-injected-input
# or exposed-secret-or-weak-crypto, so the honest disposition is not-a-bug,
# not covered.
#
# Regenerate the triage lists with:
#   python3 spec/pilots/rbac_pg/triage_2026-11-08.py \
#     --bandit spec/static-analysis/runs/rbac-pg-bandit-2026-11-08.report.json \
#     --semgrep spec/static-analysis/runs/rbac-pg-semgrep-2026-11-08.report.json \
#     --out /tmp/triage.yaml
# and re-run tools/anchor_run.py create for both runs if the entries change.

