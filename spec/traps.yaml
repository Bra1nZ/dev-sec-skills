# Known verification traps. The review step carries this file into every
# review.md; a trap is a mistake that already cost time in a real run, and the
# rules are the cheapest checks that would have caught it. Source: JOURNAL.md
# (mailcraft), Iteration 3, 2026-11-13. A trap without a rule is a story, not
# a trap; every entry here must be actionable before a run, not after.

format: "dev-sec-skills/traps/1"
updated: "2026-11-14"
traps:
  - id: stale-target-artifact
    title: >-
      A shared CARGO_TARGET_DIR shares one binary and one fingerprint across
      worktrees.
    symptom: >-
      A worktree test run is green, but the new tests are not in the binary;
      the ran-list matches a previous branch exactly.
    cause: >-
      Identical metadata hashes make all worktrees resolve the same artifact;
      an mtime fingerprint can pass even then (the exact trigger is not
      established — repeat the check on every worktree run).
    rules:
      - >-
        Touch the crate sources before EVERY test run in a shared target
        directory; an up-to-date fingerprint is not evidence.
      - >-
        After building, verify the new test is in the binary:
        strings <test-binary> | grep <new-test-name> — zero hits means the
        run was fictitious.
      - >-
        A test run of a just-created worktree against a shared target is
        unproven until one of the two checks above is done.
  - id: offline-i18n-english-only
    title: >-
      CRAFT_I18N_DIR unset builds English-only; language tests fail falsely.
    symptom: >-
      "language must be one of auto, en" for set_option("language", "de") in
      an offline run.
    cause: >-
      build.rs embeds catalogs only when CRAFT_I18N_DIR points at the catalog
      checkout — the catalog repository, not craft-libs.
    rules:
      - >-
        Set CRAFT_I18N_DIR to the catalog repo checkout before running
        ui-egui it-tests with language dependencies.
      - >-
        A language failure in an offline run is an environment artifact until
        CRAFT_I18N_DIR is ruled out, not a PR bug.
      - >-
        CI sets CRAFT_I18N_REQUIRED=1 (error, not warning), so this false
        failure does not exist there; an offline-only language failure is
        expected to disappear under CI conditions.
  - id: union-resolve-drops-imports
    title: >-
      Union of use-lists during rebase can drop imports; fmt does not catch it.
    symptom: >-
      clippy fails on an unresolved import after push; the first run was
      fmt-only.
    cause: >-
      Rebase resolution unions use-lists and can lose a symbol
      (format_date_in was lost during #5676).
    rules:
      - >-
        Run clippy --workspace --all-targets -D warnings before every push;
        fmt alone proves nothing about imports.
  - id: env-dependent-fails
    title: >-
      An environment-dependent failure is an artifact, not a PR bug, only
      with a recorded scope.
    symptom: >-
      The same failures appear on clean upstream/main in an offline build
      while CI main is green.
    cause: >-
      Offline build differences. The environment contract is CRAFT_I18N_DIR,
      TMPDIR, CARGO_TARGET_DIR.
    rules:
      - >-
        Record the environment of every check run (--environment
        offline | ci | full-local); a failure without an environment scope
        cannot be classified.
      - >-
        Baseline a suspicious failure on clean upstream/main before calling
        it a PR bug.
  - id: tmpdir-must-exist
    title: >-
      A custom TMPDIR that does not exist fails the first run; create_dir
      does not create parents.
    symptom: >-
      The first test run dies on create_dir NotFound (tests.rs:141); the
      same sources are green on the next attempt.
    cause: >-
      The test writes under std::env::temp_dir() but create_dir creates
      only the last component; a TMPDIR pointing at a fresh path
      (target/ldtmp) has no parents to build on.
    rules:
      - >-
        mkdir -p the TMPDIR before every run that sets it; create_dir
        does not create parents.
      - >-
        A first-run panic on a directory path is an environment error of
        the verifier, not a patch bug, until the missing-directory trap is
        ruled out; diagnose by the panic string before reading the diff.
  - id: test-target-mismatch
    title: >-
      A new test may live in the lib target's mod tests, not the it-target
      the filter assumes.
    symptom: >-
      cargo test --test it runs 0 tests although the test exists; the run
      is green and proves nothing.
    cause: >-
      The harness lives in mod tests inside src (lib binary), so an
      integration-target filter selects nothing; the test is real but in
      another target.
    rules:
      - >-
        Before running a filtered test, grep the diff for mod tests to see
        which target the new test lives in.
      - >-
        A filtered run with test names in the output proves ran more
        reliably than strings: stripping does not remove everything, but
        a hit count alone does not distinguish ran from merely linked.
  - id: model-handoff-fallback-dir
    title: >-
      MODEL_HANDOFF does not survive between shells; the model falls back
      to a directory inside the target.
    symptom: >-
      The handoff lands in <target>/.model-handoff/ although the run was
      launched with a handoff path in another shell.
    cause: >-
      The env var is set per shell only; a step launched without it reads
      the fallback default and writes the artifacts where nobody looks.
    rules:
      - >-
        Pass MODEL_HANDOFF explicitly to every step that writes the
        handoff; never rely on the variable surviving between shells.
      - >-
        After a handoff step, check the artifacts are at the expected
        path before the next step reads them; a fallback write is a
        silently wrong location, not an error.
