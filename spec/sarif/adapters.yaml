# SARIF adapters: engine + rule -> taxonomy finding (V2-23).
#
# An adapter does not run an engine. It normalizes a SARIF 2.1.0 file, resolves
# the engine by `tool.driver.name`, and maps each result by its rule ID. Rules
# are ordered: the first match wins. A finding whose engine or rule is not in
# this file is `unmapped`, not silently classified.
#
# `cell` is optional. A rule can map to a class without naming a cell; the
# report then says `cell: null`, which is honest. Naming a cell is an assertion
# that the rule's `failure_class` equals the cell's `failure_class`: the loader
# fails with exit 2 when they differ, and a cell that declares no
# `failure_class` cannot be named at all. `cell` syntax: <registry>/<CELL-ID>.
#
# No rule here names a cell. The engines' classes (invalid-or-injected-input,
# supply-chain-integrity) are not the invariant cells' classes (code-injection,
# input-validation, mutable-ci-action-ref), so a cell mapping would mislabel
# the finding. The adapter reports the class and leaves `cell: null`.
#
# The fixtures under fixtures/ are AUTHORED SARIF documents that follow the
# engines' documented shape. They are not captured engine runs; the report
# carries `fixture: true` and `--reject-fixtures` refuses them.
version: 1

registries:
  rbac_pg: spec/pilots/rbac_pg/cells.yaml
  craft-i18n: spec/pilots/craft-i18n/cells.yaml

engines:
  - id: semgrep
    name: Semgrep
    # osemgrep writes "Semgrep OSS" into tool.driver.name; resolve the engine
    # instead of reporting every finding as unknown-engine.
    aliases: [Semgrep OSS]
    rules:
      - id: semgrep-subprocess-shell
        match: '^python\.lang\.security\.audit\.subprocess-shell-true'
        taxonomy_class: security
        failure_class: invalid-or-injected-input
        failure_mode: deny
      - id: semgrep-formatted-sql
        match: '^python\.lang\.security\.audit\.formatted-sql-query'
        taxonomy_class: security
        failure_class: invalid-or-injected-input
        failure_mode: deny
      - id: semgrep-dangerous-subprocess
        match: '^python\.lang\.security\.audit\.dangerous-subprocess-use'
        taxonomy_class: security
        failure_class: invalid-or-injected-input
        failure_mode: deny
      - id: semgrep-hardcoded-secret
        match: '^python\.lang\.security\.secrets\.hardcoded'
        taxonomy_class: security
        failure_class: exposed-secret-or-weak-crypto
        failure_mode: abort
      # Rules authored in this repository for the p/ci pilot
      # (spec/static-analysis/rules/ci-supply-chain-2026-11-07.yml). They are
      # local rules, not Semgrep Registry rules, so they can be vendored and
      # hashed by the static-analysis run record.
      - id: semgrep-authored-mutable-action-ref
        match: '^dev-sec-skills\.ci\.mutable-action-ref$'
        taxonomy_class: security
        failure_class: supply-chain-integrity
        failure_mode: detect
      - id: semgrep-authored-secrets-inherit
        match: '^dev-sec-skills\.ci\.secrets-inherit$'
        taxonomy_class: security
        failure_class: exposed-secret-or-weak-crypto
        failure_mode: detect
      - id: semgrep-authored-dependabot-missing-cooldown
        match: '^dev-sec-skills\.ci\.dependabot-missing-cooldown$'
        taxonomy_class: security
        failure_class: supply-chain-integrity
        failure_mode: detect
      # Python rule authored for the two-engine run (C-08). Bandit B608 and
      # this rule name the same failure class, so both land in the same class
      # bucket; neither names a cell.
      - id: semgrep-authored-formatted-sql
        match: '^dev-sec-skills\.py\.formatted-sql$'
        taxonomy_class: security
        failure_class: invalid-or-injected-input
        failure_mode: deny

  - id: codeql
    name: CodeQL
    rules:
      - id: codeql-sql-injection
        match: '^py/sql-injection$'
        taxonomy_class: security
        failure_class: invalid-or-injected-input
        failure_mode: deny
      - id: codeql-command-injection
        match: '^py/command-line-injection$'
        taxonomy_class: security
        failure_class: invalid-or-injected-input
        failure_mode: deny
      - id: codeql-cleartext-logging
        match: '^py/clear-text-logging-sensitive-data$'
        taxonomy_class: security
        failure_class: exposed-secret-or-weak-crypto
        failure_mode: safe-degrade

  - id: bandit
    name: Bandit
    rules:
      - id: bandit-sql-string
        match: '^B608$'
        taxonomy_class: security
        failure_class: invalid-or-injected-input
        failure_mode: deny
      - id: bandit-hardcoded-password
        match: '^B105$'
        taxonomy_class: security
        failure_class: exposed-secret-or-weak-crypto
        failure_mode: abort
      - id: bandit-subprocess-shell
        match: '^B602$'
        taxonomy_class: security
        failure_class: invalid-or-injected-input
        failure_mode: deny
